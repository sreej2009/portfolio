    <script>
      // Reverses the redirect encoding from 404.html so deep links (e.g. a direct
      // load of /work/some-project) resolve correctly on GitHub Pages' static hosting.
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, "", l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
